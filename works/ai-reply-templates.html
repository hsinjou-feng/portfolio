<style>
/* ============ 換色只需要改這裡 / Edit colors here ============ */
:root {
  --bg:       #EEF1F5;   /* 頁面底色 */
  --surface:  #FFFFFF;   /* 卡片、縮圖底色 */
  --ink:      #101828;   /* 主要文字 */
  --muted:    #5B6676;   /* 次要文字 */
  --line:     #D3D9E2;   /* 分隔線 */
  --accent:   #2F4BFF;   /* 強調色（hover、按鈕） */
  --accent-ink: #FFFFFF; /* 強調色上的文字 */
  --shadow-card: 0 1px 2px color-mix(in srgb, var(--ink) 5%, transparent), 0 10px 30px color-mix(in srgb, var(--ink) 7%, transparent), 0 30px 70px color-mix(in srgb, var(--ink) 8%, transparent); /* 卡片陰影 */

  --font: "PingFang CJK", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 20px;
  --maxw: 1200px;
  --pad: clamp(20px, 5vw, 56px);
}


/* ============ Fonts ============
   英文：Noto Sans TC（Google Fonts）
   繁體中文：蘋方體 PingFang TC（只套用在中日韓字元；沒有蘋方的裝置會自動改用 Noto Sans TC） */
@font-face { font-family: "PingFang CJK"; font-weight: 300;
  src: local("PingFang TC Light"), local("PingFangTC-Light");
  unicode-range: U+2E80-2FFF, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF; }
@font-face { font-family: "PingFang CJK"; font-weight: 400;
  src: local("PingFang TC Regular"), local("PingFangTC-Regular");
  unicode-range: U+2E80-2FFF, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF; }
@font-face { font-family: "PingFang CJK"; font-weight: 500;
  src: local("PingFang TC Medium"), local("PingFangTC-Medium");
  unicode-range: U+2E80-2FFF, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF; }
@font-face { font-family: "PingFang CJK"; font-weight: 600 800;
  src: local("PingFang TC Semibold"), local("PingFangTC-Semibold");
  unicode-range: U+2E80-2FFF, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF; }

/* ============ Base ============ */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--pad); }
section { padding: clamp(72px, 12vw, 140px) 0; }
h1, h2, h3, h4, p { margin: 0; }
.section-title {
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.02em;
}

/* ============ Nav ============ */
.nav {
  position: fixed; inset: 0 0 auto 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 60%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
.nav .brand { font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; display: inline-flex; align-items: center; gap: 12px; }
.nav .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface); }
.nav .brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.nav .brand-name { font-weight: 800; font-size: 16px; }
.nav .brand-role { font-weight: 400; font-size: 13px; color: var(--muted); letter-spacing: 0; }
.nav ul { display: flex; gap: 32px; list-style: none; margin: 0; padding: 0; font-size: 12.5px; font-weight: 500; letter-spacing: .12em; }
.nav ul a { color: var(--muted); transition: color .2s; }
.nav ul a:hover, .nav ul a:focus-visible { color: var(--accent); }
.nav nav { margin-left: auto; margin-right: 20px; }
/* 語言切換：膠囊分段樣式，目前語言反白 */
.lang {
  font: inherit; font-size: 12px; letter-spacing: .1em; line-height: 1.5; color: var(--muted);
  background: none; border: 1px solid var(--line); border-radius: 999px;
  padding: 0; cursor: pointer; overflow: hidden; transition: border-color .3s;
  display: inline-grid; grid-template-columns: 1fr 1fr;
}
.lang:hover { border-color: var(--muted); }
.lang-opt { min-width: 2.6em; padding: 4px 8px; text-align: center; transition: background-color .3s, color .3s; }
.lang-opt:hover { color: var(--ink); }
html[lang="en"] .lang-opt[data-lang="en"], html[lang="zh-Hant"] .lang-opt[data-lang="zh"] { background: var(--ink); color: var(--surface); font-weight: 600; }
@media (max-width: 720px) { .nav ul { display: none; } }
@media (max-width: 520px) { .nav .brand-name { font-size: 14px; } .nav .brand-role { font-size: 12px; } }

/* ============ Hero ============ */
.hero {
  background: var(--surface); /* 白色 */
  min-height: min(94svh, 880px);
  padding: 92px 0 clamp(32px, 4vw, 56px);
  display: flex; flex-direction: column; justify-content: center;
}
.hero .wrap { width: 100%; }
.hero-intro { color: var(--muted); font-size: 15px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr); /* 右側照片 1:1，左側色塊填滿剩餘寬度 */
  gap: clamp(12px, 1.6vw, 20px);
  align-items: stretch; /* 左右兩張卡片等高 */
}
.hero-text {
  align-self: stretch;
  color: var(--ink);
  padding: 0 clamp(0px, 3vw, 40px) 0 0;
}
.hero-title {
  font-size: clamp(2rem, 4.8vw, 3.8rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.025em;
}
.hero-text p { color: var(--ink); font-size: 1.05rem; line-height: 1.9; max-width: 42em; margin-top: 16px; text-wrap: pretty; }
.hero-text .hero-role { color: var(--ink); font-weight: 600; font-size: 1.1rem; line-height: 1.6; margin-top: clamp(36px, 5vw, 64px); }
.hero-text .hero-role span { display: inline-block; } /* 需要換行時只在「|」之後換，不會把詞拆開 */
.hero-contact { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 24px; }
.hero-contact a { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; font-weight: 500; transition: color .2s; }
.hero-contact a:hover, .hero-contact a:focus-visible { color: var(--accent); }
.hero-contact svg { flex: none; }
.hero .portrait {
  position: relative; display: block; overflow: hidden;
  width: 100%; max-width: none; aspect-ratio: auto;
  border: none; background: none;
  border-radius: clamp(20px, 2.2vw, 32px);
}
.hero .portrait::before { content: ""; display: block; padding-top: 100%; } /* 1:1；左側內容較高時會自動撐高 */
.hero .portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; }
@media (max-width: 800px) {
  .hero-grid { grid-template-columns: 1fr; }
}
.marquee {
  overflow: hidden;
  border-block: 1px solid var(--line);
  margin: clamp(28px, 5vh, 56px) 0;
  padding: 14px 0;
  white-space: nowrap;
}
.marquee-track { display: inline-flex; animation: slide 28s linear infinite; }
.marquee-track span {
  font-size: clamp(1.4rem, 3.4vw, 2.4rem);
  font-weight: 300;
  padding-right: 1.4em;
}
.marquee-track span::after { content: "/"; color: var(--accent); padding-left: 1.4em; }
@keyframes slide { to { transform: translateX(-50%); } }
.hero-tagline { font-size: clamp(1.2rem, 2.4vw, 1.7rem); font-weight: 500; max-width: 24em; line-height: 1.4; }
.scroll-hint { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; margin-top: 32px; }
.scroll-hint i { width: 48px; height: 1px; background: var(--muted); display: block; }

/* ============ Work ============ */
#work { background: var(--surface); }
.work-list { margin-top: 56px; border-top: 1px solid var(--line); }
.work-item {
  display: grid;
  grid-template-columns: 90px 1fr minmax(180px, 300px);
  gap: 32px; align-items: center;
  padding: 36px 0;
  border-bottom: 1px solid var(--line);
  transition: padding .35s ease;
}
.work-item:hover { padding-left: 16px; }
.work-year { color: var(--muted); font-size: 15px; }
.work-title { font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 600; line-height: 1.25; letter-spacing: -0.015em; transition: color .2s; }
.work-item:hover .work-title { color: var(--accent); }
.work-tags { color: var(--muted); font-size: 15px; margin-top: 10px; }
.work-thumb {
  aspect-ratio: 4 / 3;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  overflow: hidden;
  display: grid; place-items: center;
  color: var(--muted); font-size: 13px;
}
.work-thumb img { width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 800px) {
  .work-item { grid-template-columns: 1fr; gap: 14px; }
  .work-thumb { order: -1; }
}

/* ---- Dcard 卡片（首頁） ---- */
.panel { margin-top: 56px; background: var(--surface); border-radius: clamp(24px, 3vw, 32px); padding: clamp(24px, 4vw, 48px); box-shadow: var(--shadow-card); }
.panel-head { display: flex; align-items: center; gap: clamp(16px, 2.4vw, 24px); }
.logo { flex: none; width: clamp(52px, 6vw, 72px); aspect-ratio: 1; }
.logo img { width: 100%; height: 100%; object-fit: contain; }
.panel-company { color: var(--muted); font-size: 15px; font-weight: 500; }
.panel-title { margin-top: 2px; font-size: clamp(1.3rem, 2.6vw, 1.9rem); font-weight: 700; line-height: 1.3; letter-spacing: -0.015em; }
.panel-meta { margin: clamp(24px, 3.5vw, 36px) 0 0; display: grid; gap: 18px; }
.meta-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 32px; }
.meta-row > dt, .meta-row > h4 { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1.9; }
.meta-row > dd { margin: 0; max-width: 52em; line-height: 1.85; }
.invest-row { margin-top: clamp(24px, 3vw, 32px); }
.invest-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.invest-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.invest-card { display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 20px; background: var(--bg); box-shadow: 0 6px 20px color-mix(in srgb, var(--ink) 7%, transparent); transition: box-shadow .25s, transform .25s; }
.invest-card:hover { box-shadow: 0 16px 38px color-mix(in srgb, var(--ink) 13%, transparent); transform: translateY(-3px); }
.invest-cover { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: var(--surface); overflow: hidden; }
.invest-cover img { width: 100%; height: 100%; object-fit: cover; }
.invest-body { display: flex; flex: 1; flex-direction: column; align-items: flex-start; gap: 10px; padding: 4px 8px 8px; }
.invest-stage { font-size: 13px; font-weight: 500; color: var(--muted); }
.invest-card h5 { margin: 0; font-size: 1.3rem; font-weight: 700; line-height: 1.35; text-wrap: balance; }
.invest-card h5 span { display: inline-block; }
html:lang(en) .invest-card h5 span + span { margin-left: .28em; }
.invest-problem { color: var(--muted); font-size: 14.5px; line-height: 1.75; }
.invest-result { margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.invest-result strong { font-size: 2.1rem; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; }
.invest-label { font-size: 14px; line-height: 1.6; color: var(--muted); }
.invest-note { display: inline-block; white-space: nowrap; font-size: 13px; color: var(--muted); }
.invest-btn { margin-top: 6px; padding: 11px 20px; border-radius: 12px; background: var(--surface); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 10%, transparent); font-size: 15px; font-weight: 600; color: var(--ink); transition: background .2s, color .2s; }
.invest-card:hover .invest-btn { background: var(--ink); color: var(--surface); }
.cover-simple { display: grid; place-items: center; color: var(--ink); background: var(--surface); }
.invest-card.is-disabled { position: relative; cursor: default; box-shadow: none; }
.invest-card.is-disabled > .invest-flag { position: absolute; top: 28px; right: 28px; z-index: 1; opacity: 1; padding: 5px 12px; border-radius: 999px; background: #DDE2EA; color: #4A5565; font-size: 12.5px; font-weight: 700; line-height: 1.4; letter-spacing: .02em; }
.invest-card.is-disabled > .invest-body { opacity: 1; }
.invest-card.is-disabled > .invest-body > .invest-stage, .invest-card.is-disabled > .invest-body > h5, .invest-card.is-disabled > .invest-body > .invest-problem { opacity: .5; }
.invest-btns { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; gap: 10px; }
.invest-card.is-disabled .invest-btns .invest-btn, .invest-card.is-disabled:hover .invest-btns .invest-btn { margin-top: 6px; padding: 11px 20px; background: var(--surface); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink); font-weight: 600; text-decoration: none; cursor: pointer; }
.invest-card.is-disabled .invest-btns .invest-btn:hover, .invest-card.is-disabled .invest-btns .invest-btn:focus-visible { background: var(--ink); color: var(--surface); }
.invest-card.is-disabled:hover { box-shadow: none; transform: none; }
.invest-card.is-disabled > * { opacity: .5; }
.invest-card.is-disabled .invest-cover { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.invest-card.is-disabled .invest-btn { margin-top: auto; }
.invest-card.is-disabled .invest-btn, .invest-card.is-disabled:hover .invest-btn { background: transparent; box-shadow: none; color: var(--muted); padding-left: 0; font-weight: 500; }
.panel-foot { margin-top: 16px; }
.strategy-link { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-radius: 20px; background: var(--bg); transition: background .25s, color .25s, transform .25s;  box-shadow:0 6px 20px color-mix(in srgb,var(--ink) 7%,transparent); position: relative;}
.sl-text { display: flex; flex-direction: column; gap: 2px; }
.sl-text strong { font-size: 1.05rem; font-weight: 700; }
.sl-text span { font-size: 14px; color: var(--muted); transition: color .25s; }
.sl-i { font-style:normal; display:inline-block; white-space:nowrap; }
html[lang="en"] .sl-i:not(:last-child) { margin-right:.3em; }
.sl-arrow { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 18px; transition: background .25s, color .25s, transform .25s; }
.strategy-link:hover { background: var(--ink); color: var(--surface); }
.strategy-link:hover .sl-text span { color: color-mix(in srgb, var(--surface) 70%, transparent); }
.strategy-link:hover .sl-arrow { background: var(--surface); color: var(--ink); transform: translateX(4px); }
@media (max-width: 760px) {
  .meta-row { grid-template-columns: 1fr; gap: 2px; }
  .invest-grid, .invest-grid.cols-2 { grid-template-columns: 1fr; }
  .invest-cover { aspect-ratio: 2.4 / 1; }
}

/* ============ Experience ============ */
.exp-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; }
.btn {
  display: inline-block; font: inherit; font-size: 15px; font-weight: 500;
  padding: 12px 24px; border-radius: 999px;
  background: var(--ink); color: var(--bg);
  transition: background .25s, color .25s, transform .25s;
}
.btn:hover { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
.btn.ghost:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.exp-list { margin-top: 48px; border-top: 1px solid var(--line); }
.exp-row {
  display: grid; grid-template-columns: 200px 1fr auto; gap: 24px; align-items: baseline;
  padding: 26px 0; border-bottom: 1px solid var(--line);
}
.exp-years { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.exp-role { font-size: 1.25rem; font-weight: 600; }
.exp-company { color: var(--muted); }
@media (max-width: 720px) { .exp-row { grid-template-columns: 1fr; gap: 4px; } }

/* ============ Testimonials（推薦）============ */
#recommendation { background: var(--surface); }
.t-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.t-nav { display: flex; gap: 10px; }
.t-arrow { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bg); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; box-shadow: 0 6px 20px color-mix(in srgb, var(--ink) 7%, transparent); transition: background .2s, color .2s, opacity .2s; }
.t-arrow:hover:not(:disabled) { background: var(--ink); color: var(--surface); }
.t-arrow:disabled { opacity: .4; cursor: default; }
.t-track { --tp: min(48px, var(--pad)); margin: 28px calc(-1 * var(--tp)) -48px; padding: 24px var(--tp) 96px; display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 var(--tp); scrollbar-width: none; cursor: grab; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.t-track::-webkit-scrollbar { display: none; }
.t-track.dragging { cursor: grabbing; scroll-snap-type: none; user-select: none; }
.t-card { flex: 0 0 calc((100% - 16px) / 2); scroll-snap-align: start; margin: 0; display: flex; flex-direction: column; gap: 24px; padding: clamp(20px, 2.4vw, 28px); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow-card); }
.t-person { display: flex; align-items: center; gap: 14px; }
.t-avatar { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--bg); overflow: hidden; }
.t-avatar img { width: 100%; height: 100%; object-fit: cover; }
.t-initials { display: grid; place-items: center; font-weight: 700; font-size: 1.05rem; color: var(--muted); }
.t-name { font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
.t-role { color: var(--muted); font-size: 14px; line-height: 1.5; }
.t-rel { align-self: flex-start; padding: 4px 12px; border-radius: 10px; line-height: 1.5; background: var(--bg); font-size: 13px; color: var(--muted); }
.t-body { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.t-quote { margin: 0; font-size: 1rem; line-height: 1.8; color: var(--ink); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 9; line-clamp: 9; overflow: hidden; }
.t-card.open .t-quote { -webkit-line-clamp: unset; line-clamp: unset; display: block; }
.t-quote p + p { margin-top: 10px; }
.t-toggle { margin-top: auto; padding: 8px 16px; border: 0; border-radius: 12px; background: var(--bg); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; transition: background .2s, color .2s; }
.t-toggle:hover { background: var(--ink); color: var(--surface); }
.t-toggle .less { display: none; }
.t-card.open .t-toggle .more { display: none; }
.t-card.open .t-toggle .less { display: inline; }
.t-more { margin-top: 8px; }
@media (max-width: 800px) { .t-card { flex-basis: calc(100% - 28px); } }
.t-track:has(.t-card.open) { align-items: flex-start; }
.t-link { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; font-weight: 500; transition: color .2s; }
.t-link:hover, .t-link:focus-visible { color: var(--accent); }

footer { background: var(--surface); color: var(--muted); font-size: 14px; padding: 28px 0 32px; }
footer a { color: inherit; }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .marquee-track { animation: none; }
  * { transition: none !important; }
}



.sp-hero { background: var(--surface); padding: 108px 0 clamp(48px, 7vw, 88px); }

.sp-title { margin-top: 2px; font-size: clamp(1.3rem, 2.6vw, 1.9rem); font-weight: 700; line-height: 1.3; letter-spacing: -0.015em; text-wrap: balance; }
.sp-meta { margin-top: clamp(32px, 5vw, 56px); display: grid; grid-template-columns: minmax(0, 1fr) 215px; gap: 28px clamp(32px, 6vw, 96px); }

.sp-sec { background: var(--surface); }
.sp-sec::before { content: ""; display: block; height: 1px; background: var(--line); width: min(calc(100% - 2 * var(--pad)), calc(var(--maxw) - 2 * var(--pad))); margin: 0 auto; }
.sp-sec > .wrap { padding-top: clamp(56px, 8vw, 104px); padding-bottom: clamp(56px, 8vw, 104px); }
.sp-row { display: grid; grid-template-columns: minmax(150px, 0.3fr) minmax(0, 1fr); gap: 20px clamp(24px, 5vw, 72px); align-items: start; }
.sp-eyebrow { position: sticky; top: 96px; display: block; font-size: 15px; font-weight: 600; color: var(--accent); line-height: 1.9; }
.sp-h2 { font-size: clamp(1.4rem, 2.5vw, 1.9rem); font-weight: 600; line-height: 1.5; letter-spacing: -0.015em; max-width: 30em; text-wrap: pretty; }
.sp-h2 strong { font-weight: 800; }
.sp-lead { margin-top: 24px; max-width: 46em; line-height: 1.9; }
.sp-grid { margin-top: 28px; display: grid; gap: 16px; }
.sp-grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sp-grid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sp-card { display: flex; flex-direction: column; gap: 6px; padding: clamp(20px, 2.4vw, 28px); border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.sp-ic { width: 52px; height: 52px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; color: var(--ink); margin-bottom: 14px; }
.sp-ic svg { width: 26px; height: 26px; }
/* 01 背景與問題：卡片一律一欄排列，icon 在左、文字在右 */
#background .sp-grid { grid-template-columns: minmax(0, 1fr); }
#background .sp-card { display: grid; grid-template-columns: 52px minmax(0, 1fr); column-gap: 20px; row-gap: 4px; align-content: start; }
#background .sp-ic { grid-row: 1 / span 3; margin-bottom: 0; }
#background .sp-card > :not(.sp-ic) { grid-column: 2; }
.sp-num { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.sp-who { font-size: 14px; font-weight: 500; color: var(--muted); }
.sp-metrics { grid-template-columns: 1fr; gap: 0; margin-top: 28px; }
.sp-metrics .sp-card { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 12px; padding: 24px 0; border: 0; border-radius: 0; background: transparent; border-top: 1px solid var(--line); }
.sp-metrics .sp-card:last-child { padding-bottom: 0; }
.sp-metrics .sp-num { grid-row: 1 / span 2; font-size: 14px; font-weight: 700; color: var(--accent); line-height: 1.9; letter-spacing: 0; }
.sp-metrics .sp-card h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.6; }
.sp-metrics .sp-card p { margin: 0; max-width: 46em; font-size: 15px; line-height: 1.85; }
@media (max-width: 700px) { .sp-metrics .sp-card { grid-template-columns: 1fr; } .sp-metrics .sp-num { grid-row: auto; } }
.sp-card h3 { margin: 0; font-size: 1.2rem; font-weight: 700; line-height: 1.45; }
.sp-card p { color: var(--muted); font-size: 15px; line-height: 1.8; }
.sp-card .sp-k { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.sp-card .sp-v { color: var(--ink); font-weight: 600; font-size: 1.05rem; line-height: 1.6; }
.sp-close { margin-top: 28px; max-width: 46em; line-height: 1.9; }
.sp-note { margin-top: 20px; display: flex; gap: 10px; align-items: flex-start; padding: 0; color: var(--muted); font-size: 14.5px; line-height: 1.75; }
.sp-note svg { flex: none; width: 20px; height: 20px; margin-top: 2px; }
.sp-sec .invest-grid { margin-top: 24px; grid-template-columns: 1fr; }
.sp-sec .invest-card { flex-direction: row; align-items: stretch; gap: 24px; }
.sp-sec .invest-card { background: var(--surface); border: 1px solid var(--line); box-shadow: none; }
.sp-sec .invest-card:hover { box-shadow: none; transform: none; }
.sp-sec .invest-cover { background: var(--bg); }
.sp-sec .invest-btn { background: var(--bg); box-shadow: none; align-self: flex-end; margin-top: auto; }
.sp-sec .invest-btn:hover, .sp-sec .invest-btn:focus-visible { background: var(--ink); color: var(--surface); }
.sp-sec .invest-cover { flex: 0 0 38%; align-self: flex-start; }
.sp-sec .invest-body { padding: 8px 8px 8px 0; justify-content: flex-start; }
.sp-sec .invest-result { margin-top: 8px; }
.sp-sec .invest-btn { margin-top: auto; }
.sp-sec .invest-result + .invest-result { margin-top: 0; padding-top: 0; }
.sp-row > * { min-width: 0; }
.sp-map { min-width: 0; max-width: 100%; margin: 28px 0 0; padding: clamp(16px, 2.4vw, 28px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.sp-map figcaption { margin-bottom: 14px; font-size: 14px; font-weight: 600; color: var(--muted); }
.sp-map-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.mm-svg { display: block; width: 100%; height: auto; min-width: 0; }
.mm-svg .mm-font { font-family: var(--font); }
.sp-map .sp-hint { margin-top: 10px; font-size: 13px; color: var(--muted); }
.sp-map figcaption { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sp-zoom { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 0; border-radius: 10px; background: var(--bg); font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; transition: background .2s, color .2s; }
.sp-zoom:hover { background: var(--ink); color: var(--surface); }
.sp-zoom svg { width: 14px; height: 14px; }
.sp-map-scroll { cursor: zoom-in; }
.mm-modal { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; background: color-mix(in srgb, var(--ink) 55%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: clamp(12px, 3vw, 32px); }
.mm-modal.open { display: flex; }

.mm-btn { min-width: 40px; height: 40px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--surface); font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; transition: background .2s, color .2s; }
.mm-btn:hover { background: var(--ink); color: var(--surface); }
.mm-stage { flex: 1; min-height: 0; overflow: auto; border-radius: var(--radius); background: var(--surface); padding: 16px; -webkit-overflow-scrolling: touch; }

@media (max-width: 900px) {
  .sp-grid.c3, .sp-grid.c2 { grid-template-columns: 1fr; }

  .sp-meta { grid-template-columns: 1fr; }
  .sp-sec .invest-card { flex-direction: column; gap: 14px; }
  .sp-sec .invest-cover { flex-basis: auto; align-self: auto; }

}

/* ---- Going Cloud ---- */
/* 鎖定時內容很短：讓白色主區塊撐滿視窗，頁尾貼齊底部，不露出灰色底 */
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
main { flex: 1; display: flex; flex-direction: column; }
main > .sp-hero { flex: 1 0 auto; }
.logo-tile img { border-radius: 22.36%; box-shadow: 0 0 0 1px var(--line); }
.gc-list { margin: 4px 0 0; padding-left: 1.1em; display: grid; gap: 8px; color: var(--ink); font-size: 15px; line-height: 1.8; }
.gc-list li::marker { color: var(--muted); }
.sp-card.gc-flash { animation: gc-flash 1.8s ease-out; }
@keyframes gc-flash { 0%, 40% { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 12%, transparent); } 100% { border-color: var(--line); box-shadow: none; } }

/* ---- 密碼鎖 ---- */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.gc-lock { margin-top: clamp(32px, 5vw, 56px); max-width: 520px; padding: clamp(24px, 3.2vw, 36px); border-radius: var(--radius); background: var(--bg); }
.gc-lock-ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); color: var(--ink); }
.gc-lock-ic svg { width: 22px; height: 22px; }
.gc-lock h2 { margin: 18px 0 6px; font-size: 1.25rem; font-weight: 700; line-height: 1.45; }
.gc-lock p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
.gc-form { margin-top: 20px; display: flex; gap: 10px; }
.gc-form input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); outline: none; transition: border-color .2s, box-shadow .2s; }
.gc-form input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 10%, transparent); }
.gc-form button { flex: none; font: inherit; font-size: 15px; font-weight: 600; padding: 11px 20px; border-radius: 12px; border: 1px solid var(--ink); background: var(--ink); color: var(--surface); cursor: pointer; transition: opacity .2s; }
.gc-form button:disabled { opacity: .6; cursor: progress; }
.gc-err { min-height: 1.6em; margin-top: 10px !important; color: #C0362C !important; font-size: 14px !important; }
.gc-lock.shake { animation: gc-shake .4s; }
@keyframes gc-shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@media (max-width: 520px) { .gc-form { flex-direction: column; } }

/* ---- 02 核心策略：一個策略一張卡片，「關鍵瓶頸（灰底）→ 策略投資（藍線）」兩段式 ---- */
.sp-table { grid-template-columns: minmax(0, 1fr); gap: 12px; }
.sp-table .sp-card { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; row-gap: 0; align-items: baseline; padding: 20px clamp(18px, 2.4vw, 26px) 22px; }
.sp-table .sp-card > * { grid-column: 1 / -1; }
.sp-table .sp-card .sp-num { grid-column: 1; grid-row: 1; font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: 0; }
.sp-table .sp-card h3 { grid-column: 2; grid-row: 1; margin: 0; font-size: 1.1rem; }
/* 小標：粗體、加寬字距，與內文明確區隔 */
.sp-table .sp-card .sp-k { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.sp-table .sp-card p, .sp-table .sp-card .gc-list { margin: 0; font-size: 15px; line-height: 1.8; }
/* 第一段：關鍵瓶頸／要建立的能力，淺灰底代表現況 */
.sp-table .sp-card h3 + .sp-k { margin-top: 14px; padding: 10px 14px 2px; border-radius: 10px 10px 0 0; background: var(--bg); }
.sp-table .sp-card h3 + .sp-k + * { padding: 0 14px 11px; border-radius: 0 0 10px 10px; background: var(--bg); color: var(--muted); }
/* 第二段：策略投資，藍色左線＋箭頭代表因此採取的解法 */
.sp-table .sp-card h3 + .sp-k + * + .sp-k { margin-top: 12px; padding: 0 0 2px 14px; color: var(--accent); }
.sp-table .sp-card h3 + .sp-k + * + .sp-k + * { padding-left: 14px; color: var(--ink); }
.sp-table .sp-card .sp-v { font-weight: 600; }
.sp-table .sp-card h3 + .sp-k + * + .sp-k + .gc-list { padding-left: calc(14px + 1.2em); }
.sp-table .sp-card .gc-list { gap: 6px; }

/* 有先後順序的旅程：左側縱線把 01 → 02 → 03 串起來 */
.sp-steps { position: relative; padding-left: 44px; }
.sp-steps::before { content: ""; position: absolute; left: 15px; top: 36px; bottom: 36px; width: 2px; background: var(--line); }
.sp-steps .sp-card { position: relative; }
.sp-steps .sp-card .sp-num { position: absolute; left: -44px; top: 19px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 13px; line-height: 1; box-shadow: 0 0 0 4px var(--surface); }
.sp-steps .sp-card h3 { grid-column: 1 / -1; }
@media (max-width: 600px) {
  .sp-steps { padding-left: 38px; }
  .sp-steps::before { left: 13px; }
  .sp-steps .sp-card .sp-num { left: -38px; width: 28px; height: 28px; font-size: 12px; }
}
/* 統一的小標樣式：卡片內「說明下方內容是什麼」的灰色小字 */
.sp-who, .sp-table .sp-card .sp-k, .invest-stage { font-size: 13px; font-weight: 600; letter-spacing: .04em; }

/* ============ LLM 品質驗收頁 ============ */
/* 區塊間距：與其他專案頁一致 */
.sp-sec > .wrap { padding-top: clamp(36px, 5vw, 56px); padding-bottom: clamp(36px, 5vw, 56px); }
.sp-hero { padding-bottom: clamp(32px, 4vw, 48px); }
.sp-sec { padding: 0; }
.sp-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.sp-chips span { padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; font-weight: 500; line-height: 1.5; background: var(--surface); }
/* 評估節點表格 */
.lq-tbl { margin-top: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.lq-tr { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1.5fr); gap: 20px; align-items: start; padding: 18px 24px; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.75; }
.lq-tr:first-child { border-top: 0; }
.lq-th { padding-top: 13px; padding-bottom: 13px; background: var(--bg); font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.lq-node { font-weight: 700; }
.lq-c { font-weight: 600; }
.lq-m small { display: block; margin-top: 2px; font-size: 13px; line-height: 1.6; color: var(--muted); }
.lq-why { color: var(--muted); }
/* 步驟列表 */
.lq-steps { margin-top: 28px; display: grid; }
.lq-step { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 12px; padding: 22px 0; border-top: 1px solid var(--line); }
.lq-step:last-child { border-bottom: 1px solid var(--line); }
.lq-n { font-size: 1.1rem; font-weight: 700; color: var(--accent); line-height: 1.6; }
.lq-step h3 { margin: 0 0 6px; font-size: 1.1rem; font-weight: 700; line-height: 1.6; }
.lq-step p { margin: 0; max-width: 46em; font-size: 15px; line-height: 1.85; color: var(--muted); }
.lq-tag { display: inline-block; margin: 0 0 6px; padding: 2px 10px; border-radius: 999px; background: var(--bg); font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
/* 可複用／客製化 */
.lq-reuse { margin-top: 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.lq-rc { padding: clamp(20px, 2.4vw, 26px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.lq-rc h3 { margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--accent); }
.lq-rc .sp-chips span { font-size: 14px; padding: 6px 13px; background: var(--bg); border-color: transparent; }
/* 圖表：英文模式隱藏重複的英文副標 */
html[lang="en"] .mm-svg .llm-node-en, html[lang="en"] .mm-svg .llm-io-sub, html[lang="en"] .mm-svg .wf-sub { display: none; }
.sp-map.lq-wide { grid-column: 2; margin-top: 8px; } /* 圖表放在右欄，左欄留白，捲動時不被固定的段落標題遮住 */
@media (max-width: 900px) { .sp-map.lq-wide { grid-column: auto; } }
@media (max-width: 900px) { .sp-map .mm-svg { min-width: 900px; } }
@media (min-width: 901px) { .sp-meta { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } } /* 與其他專案頁相同 */
@media (max-width: 900px) {
  .lq-th { display: none; }
  .lq-tr { grid-template-columns: 1fr; gap: 4px; padding: 18px 20px; }
  .lq-reuse { grid-template-columns: 1fr; }
}

/* ============ AI 回覆模板頁 ============ */
.art-tbl .lq-tr { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1.1fr) minmax(0, 1.2fr); }
.lq-m small { display: block; margin-top: 2px; font-size: 13px; line-height: 1.6; color: var(--muted); }
/* 這項定義會影響：一列四欄圓角方塊 */
.art-impact { margin-top: 24px; }
.art-impact h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.art-imp { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.art-imp > div { display: grid; place-items: center; min-height: 64px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 14.5px; font-weight: 600; line-height: 1.5; text-align: center; }
/* 回覆模板結構示意：對話畫面 */
.art-fig figcaption { display: flex; }
.art-chat { max-width: 520px; margin: 0 auto; padding: clamp(14px, 2vw, 22px); border-radius: 22px; background: var(--bg); display: grid; gap: 14px; font-size: 14px; line-height: 1.7; }
.art-user { justify-self: end; max-width: 80%; padding: 9px 14px; border-radius: 16px 16px 4px 16px; background: var(--ink); color: var(--surface); }
.art-reply { display: grid; gap: 20px; padding-top: 6px; }
.art-blk { position: relative; display: grid; gap: 8px; padding: 30px 14px 14px; border: 1.5px dashed var(--line); border-radius: 14px; background: var(--surface); }
.art-pill { position: absolute; top: -11px; left: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; font-weight: 700; line-height: 1.6; white-space: nowrap; }
.art-pill b { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; }
.art-pill em { font-style: normal; font-weight: 500; color: var(--muted); }
.art-pill em::before { content: "・"; }
.art-blk p { margin: 0; }
.art-sum { font-weight: 600; }
.art-h { font-weight: 700; }
.art-ol { margin: 0; padding-left: 1.3em; color: var(--ink); }
.art-tb { display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; }
.art-tr { display: grid; grid-template-columns: .8fr 1fr 1fr; }
.art-tr span { padding: 6px 10px; border-top: 1px solid var(--line); }
.art-tr:first-child span { border-top: 0; }
.art-thr { background: var(--bg); font-weight: 600; color: var(--muted); }
.art-guide { color: var(--ink); }
.art-cta { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.art-th { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); opacity: .85; }
.art-ct { display: grid; line-height: 1.5; }
.art-ct small { font-size: 12.5px; color: var(--muted); }
.art-ar { font-size: 20px; color: var(--muted); }
.art-cite { font-size: 13px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.art-fu-h { font-weight: 600; }
.art-fu { color: var(--accent); }
.art-fu::before { content: "→ "; }
@media (max-width: 700px) {
  .art-imp { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* 02 抽象化共通架構：左輸入 → 右輸出 */
.art-fn { margin-top: 28px; display: grid; grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr); align-items: start; gap: 16px; padding: clamp(20px, 2.4vw, 28px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.art-fn-col { display: grid; gap: 10px; align-content: start; }
.art-fn-h { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--accent); }
.art-fn-chip { padding: 9px 14px; border-radius: 12px; background: var(--bg); font-size: 14px; font-weight: 500; line-height: 1.5; }
.art-fn-out { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); color: var(--ink); font-weight: 600; }
.art-fn-mid { display: grid; place-items: center; align-self: stretch; color: var(--accent); }
.art-fn-mid svg { width: 28px; height: 28px; }
@media (max-width: 700px) {
  .art-fn { grid-template-columns: 1fr; }
  .art-fn-mid svg { transform: rotate(90deg); }
}
/* 延伸閱讀小卡：Going Cloud 圖示封面（同 index） */
.cover-simple { display: grid; place-items: center; color: var(--ink); }
.gc-ic * { transform-box: fill-box; }
.gc-ic .ln { transform-origin: left center; }
.gc-ic-check .badge { transform-origin: center; }
.gc-ic-check .tick { stroke-dasharray: 1; stroke-dashoffset: 0; }
.gc-ic-chat .b1 { transform-origin: left bottom; }
.gc-ic-chat .b2 { transform-origin: right top; }
.gc-ic-docs .p1, .gc-ic-docs .p2, .gc-ic-docs .p3 { transform-origin: center bottom; transition: transform .45s cubic-bezier(.34,1.56,.64,1); }
@media (prefers-reduced-motion: no-preference) {
  .invest-card:hover .gc-ic-check .ln, .invest-card:focus-visible .gc-ic-check .ln { animation: gc-draw .45s ease-out both; }
  .invest-card:hover .gc-ic-check .ln2 { animation-delay: .12s; }
  .invest-card:hover .gc-ic-check .ln3 { animation-delay: .24s; }
  .invest-card:hover .gc-ic-check .badge { animation: gc-pop .5s .4s cubic-bezier(.34,1.56,.64,1) both; }
  .invest-card:hover .gc-ic-check .tick { animation: gc-tick .35s .65s ease-out both; }

  .invest-card:hover .gc-ic-chat .b1 { animation: gc-in-left .45s cubic-bezier(.34,1.56,.64,1) both; }
  .invest-card:hover .gc-ic-chat .b2 { animation: gc-in-right .45s .18s cubic-bezier(.34,1.56,.64,1) both; }
  .invest-card:hover .gc-ic-chat .d1 { animation: gc-typing 1s .6s ease-in-out infinite; }
  .invest-card:hover .gc-ic-chat .d2 { animation: gc-typing 1s .8s ease-in-out infinite; }

  .invest-card:hover .gc-ic-docs .p1 { transform: translateX(-4px) rotate(-8deg); }
  .invest-card:hover .gc-ic-docs .p2 { transform: rotate(-3deg); transition-delay: .05s; }
  .invest-card:hover .gc-ic-docs .p3 { transform: translate(3px, -3px) rotate(4deg); transition-delay: .1s; }
  .invest-card:hover .gc-ic-docs .ln { animation: gc-draw .4s .25s ease-out both; }
  .invest-card:hover .gc-ic-docs .ln2 { animation-delay: .35s; }
  .invest-card:hover .gc-ic-docs .ln3 { animation-delay: .45s; }
}
@keyframes gc-draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes gc-pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
@keyframes gc-tick { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes gc-in-left { from { transform: translateX(-8px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes gc-in-right { from { transform: translateX(8px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes gc-typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
.invest-btn .btn-lock { width: 14px; height: 14px; margin-right: 6px; vertical-align: -1px; }
.sp-next { margin-top: 28px; }
#further-reading .invest-grid { margin-top: 0; } /* 延伸閱讀只放卡片，與左側段落標題對齊 */
</style>
</head>

<script>
(function () {
  // Nav border on scroll
  var nav = document.getElementById('nav');
  function onScroll() { nav.classList.toggle('scrolled', window.scrollY > 10); }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // EN / 中 toggle
  var lang = 'en'; // 預設英文；訪客手動切換後會記住選擇
  try { var saved = localStorage.getItem('lang'); if (saved === 'zh' || saved === 'en') lang = saved; } catch (e) {}

  function apply() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
    document.querySelectorAll('[data-en]').forEach(function (el) {
      el.innerHTML = el.getAttribute('data-' + lang);
    });
  }

  document.getElementById('langBtn').addEventListener('click', function (e) {
    var opt = e.target.closest('.lang-opt');
    lang = opt ? opt.getAttribute('data-lang') : (lang === 'en' ? 'zh' : 'en');
    try { localStorage.setItem('lang', lang); } catch (e) {}
    apply();
  });
  apply();
  window.__applyLang = apply;

})();
</script>

<script>
(function () {
  var KEY_STORE = 'gc-strategy-key';
  var lock = document.getElementById('gcLock'), form = document.getElementById('gcForm');
  var pw = document.getElementById('gcPw'), btn = document.getElementById('gcBtn'), err = document.getElementById('gcErr');
  var content = document.getElementById('gcContent');
  var payload = JSON.parse(document.getElementById('enc-payload').textContent);
  var b = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var isZh = function () { return document.documentElement.lang === 'zh-Hant'; };

  function syncPlaceholder() { pw.placeholder = pw.getAttribute(isZh() ? 'data-ph-zh' : 'data-ph-en'); }
  new MutationObserver(syncPlaceholder).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  syncPlaceholder();

  function deriveKey(password) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(payload.salt), iterations: payload.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function decrypt(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(payload.iv) }, key, b(payload.ct)).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function reveal(html) {
    content.innerHTML = html;
    var meta = content.querySelector('.gc-meta');
    if (meta) document.getElementById('gcHero').appendChild(meta);
    lock.remove();
    content.hidden = false;
    if (window.__applyLang) window.__applyLang();
    // 從首頁小卡帶 #pillar-n 進來：解鎖後捲到對應的策略支柱並短暫標示
    var target = location.hash && document.getElementById(location.hash.slice(1));
    if (target) {
      requestAnimationFrame(function () {
        target.scrollIntoView({ block: 'center' });
        target.classList.add('gc-flash');
        setTimeout(function () { target.classList.remove('gc-flash'); }, 1800);
      });
    }
  }

  // 同一個分頁內已解鎖過：直接用暫存的金鑰（關閉分頁即失效）
  try {
    var saved = sessionStorage.getItem(KEY_STORE);
    if (saved) {
      crypto.subtle.importKey('raw', b(saved), 'AES-GCM', false, ['decrypt']).then(decrypt).then(reveal)
        .catch(function () { sessionStorage.removeItem(KEY_STORE); });
    }
  } catch (e) {}

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true; err.textContent = '';
    var key;
    deriveKey(pw.value).then(function (k) { key = k; return decrypt(k); }).then(function (html) {
      crypto.subtle.exportKey('raw', key).then(function (raw) {
        try { sessionStorage.setItem(KEY_STORE, btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch (e) {}
      });
      reveal(html);
    }).catch(function () {
      btn.disabled = false;
      err.textContent = isZh() ? '密碼不正確，請再試一次。' : 'Incorrect password. Please try again.';
      lock.classList.remove('shake'); void lock.offsetWidth; lock.classList.add('shake');
      pw.select();
    });
  });
})();
</script>

<script>
(function () {
  // 圖表放大：內容是解鎖後才插入，所以用事件委派
  var modal = document.getElementById('mmModal'), stage = document.getElementById('mmStage');
  var svg = null, scale = 1, opener = null;
  function apply() { svg.style.width = (scale * 100) + '%'; svg.style.minWidth = scale > 1 ? '' : '0'; }
  function show(src, from) {
    opener = from;
    svg = src.cloneNode(true); svg.setAttribute('class', 'mm-svg mm-zoomed');
    stage.innerHTML = ''; stage.appendChild(svg);
    scale = window.innerWidth < 900 ? 2.2 : 1; apply();
    modal.classList.add('open'); document.body.style.overflow = 'hidden';
    document.getElementById('mmClose').focus();
  }
  function hide() { modal.classList.remove('open'); document.body.style.overflow = ''; if (opener) opener.focus(); }
  document.addEventListener('click', function (e) {
    var trg = e.target.closest && e.target.closest('.sp-zoom, .sp-map-scroll');
    if (!trg) return;
    var fig = trg.closest('.sp-map'), src = fig && fig.querySelector('.mm-svg');
    if (src) show(src, fig.querySelector('.sp-zoom'));
  });
  document.getElementById('mmClose').addEventListener('click', hide);
  modal.addEventListener('click', function (e) { if (e.target === modal) hide(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.classList.contains('open')) hide(); });
  document.getElementById('mmIn').addEventListener('click', function () { scale = Math.min(scale + 0.4, 4); apply(); });
  document.getElementById('mmOut').addEventListener('click', function () { scale = Math.max(scale - 0.4, 0.6); apply(); });
  document.getElementById('mmFit').addEventListener('click', function () { scale = 1; apply(); stage.scrollTo(0, 0); });
})();
</script>

<!-- 停用右鍵、複製與文字選取（輸入框除外）；不影響搜尋引擎與 AI 工具讀取原始碼 -->
<style>
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
img { -webkit-user-drag: none; }
</style>
<script>
(function () {
  function editable(t) { return t && t.closest && t.closest('input, textarea, [contenteditable]'); }
  ['contextmenu', 'copy', 'cut', 'selectstart', 'dragstart'].forEach(function (type) {
    document.addEventListener(type, function (e) { if (!editable(e.target)) e.preventDefault(); });
  });
})();
</script>
</body>
</html>
