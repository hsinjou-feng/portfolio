<style>
/* ============ 換色只需要改這裡 / Edit colors here ============ */
:root {
  --bg:       #EEF1F5;   /* 頁面底色 */
  --surface:  #FFFFFF;   /* 卡片、縮圖底色 */
  --ink:      #101828;   /* 主要文字 */
  --muted:    #5B6676;   /* 次要文字 */
  --line:     #D3D9E2;   /* 分隔線 */
  --accent:   #2F4BFF;   /* 強調色（hover、按鈕） */
  --accent-ink: #FFFFFF; /* 強調色上的文字 */
  --shadow-card: 0 1px 2px color-mix(in srgb, var(--ink) 5%, transparent), 0 10px 30px color-mix(in srgb, var(--ink) 7%, transparent), 0 30px 70px color-mix(in srgb, var(--ink) 8%, transparent); /* 卡片陰影 */

  --font: "PingFang CJK", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 20px;
  --maxw: 1200px;
  --pad: clamp(20px, 5vw, 56px);
}


/* ============ Fonts ============
   英文：Noto Sans TC（Google Fonts）
   繁體中文：蘋方體 PingFang TC（只套用在中日韓字元；沒有蘋方的裝置會自動改用 Noto Sans TC） */
@font-face { font-family: "PingFang CJK"; font-weight: 300;
  src: local("PingFang TC Light"), local("PingFangTC-Light");
  unicode-range: U+2E80-2FFF, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF; }
@font-face { font-family: "PingFang CJK"; font-weight: 400;
  src: local("PingFang TC Regular"), local("PingFangTC-Regular");
  unicode-range: U+2E80-2FFF, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF; }
@font-face { font-family: "PingFang CJK"; font-weight: 500;
  src: local("PingFang TC Medium"), local("PingFangTC-Medium");
  unicode-range: U+2E80-2FFF, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF; }
@font-face { font-family: "PingFang CJK"; font-weight: 600 800;
  src: local("PingFang TC Semibold"), local("PingFangTC-Semibold");
  unicode-range: U+2E80-2FFF, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF; }

/* ============ Base ============ */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--pad); }
section { padding: clamp(72px, 12vw, 140px) 0; }
h1, h2, h3, h4, p { margin: 0; }
.section-title {
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.02em;
}

/* ============ Nav ============ */
.nav {
  position: fixed; inset: 0 0 auto 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 60%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
.nav .brand { font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; display: inline-flex; align-items: center; gap: 12px; }
.nav .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface); }
.nav .brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.nav .brand-name { font-weight: 800; font-size: 16px; }
.nav .brand-role { font-weight: 400; font-size: 13px; color: var(--muted); letter-spacing: 0; }
.nav ul { display: flex; gap: 32px; list-style: none; margin: 0; padding: 0; font-size: 12.5px; font-weight: 500; letter-spacing: .12em; }
.nav ul a { color: var(--muted); transition: color .2s; }
.nav ul a:hover, .nav ul a:focus-visible { color: var(--accent); }
.nav nav { margin-left: auto; margin-right: 20px; }
/* 語言切換：膠囊分段樣式，目前語言反白 */
.lang {
  font: inherit; font-size: 12px; letter-spacing: .1em; line-height: 1.5; color: var(--muted);
  background: none; border: 1px solid var(--line); border-radius: 999px;
  padding: 0; cursor: pointer; overflow: hidden; transition: border-color .3s;
  display: inline-grid; grid-template-columns: 1fr 1fr;
}
.lang:hover { border-color: var(--muted); }
.lang-opt { min-width: 2.6em; padding: 4px 8px; text-align: center; transition: background-color .3s, color .3s; }
.lang-opt:hover { color: var(--ink); }
html[lang="en"] .lang-opt[data-lang="en"], html[lang="zh-Hant"] .lang-opt[data-lang="zh"] { background: var(--ink); color: var(--surface); font-weight: 600; }
@media (max-width: 720px) { .nav ul { display: none; } }
@media (max-width: 520px) { .nav .brand-name { font-size: 14px; } .nav .brand-role { font-size: 12px; } }

/* ============ Hero ============ */
.hero {
  background: var(--surface); /* 白色 */
  min-height: min(94svh, 880px);
  padding: 92px 0 clamp(32px, 4vw, 56px);
  display: flex; flex-direction: column; justify-content: center;
}
.hero .wrap { width: 100%; }
.hero-intro { color: var(--muted); font-size: 15px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr); /* 右側照片 1:1，左側色塊填滿剩餘寬度 */
  gap: clamp(12px, 1.6vw, 20px);
  align-items: stretch; /* 左右兩張卡片等高 */
}
.hero-text {
  align-self: stretch;
  color: var(--ink);
  padding: 0 clamp(0px, 3vw, 40px) 0 0;
}
.hero-title {
  font-size: clamp(2rem, 4.8vw, 3.8rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.025em;
}
.hero-text p { color: var(--ink); font-size: 1.05rem; line-height: 1.9; max-width: 42em; margin-top: 16px; text-wrap: pretty; }
.hero-text .hero-role { color: var(--ink); font-weight: 600; font-size: 1.1rem; line-height: 1.6; margin-top: clamp(36px, 5vw, 64px); }
.hero-text .hero-role span { display: inline-block; } /* 需要換行時只在「|」之後換，不會把詞拆開 */
.hero-contact { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 24px; }
.hero-contact a { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; font-weight: 500; transition: color .2s; }
.hero-contact a:hover, .hero-contact a:focus-visible { color: var(--accent); }
.hero-contact svg { flex: none; }
.hero .portrait {
  position: relative; display: block; overflow: hidden;
  width: 100%; max-width: none; aspect-ratio: auto;
  border: none; background: none;
  border-radius: clamp(20px, 2.2vw, 32px);
}
.hero .portrait::before { content: ""; display: block; padding-top: 100%; } /* 1:1；左側內容較高時會自動撐高 */
.hero .portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; }
@media (max-width: 800px) {
  .hero-grid { grid-template-columns: 1fr; }
}
.marquee {
  overflow: hidden;
  border-block: 1px solid var(--line);
  margin: clamp(28px, 5vh, 56px) 0;
  padding: 14px 0;
  white-space: nowrap;
}
.marquee-track { display: inline-flex; animation: slide 28s linear infinite; }
.marquee-track span {
  font-size: clamp(1.4rem, 3.4vw, 2.4rem);
  font-weight: 300;
  padding-right: 1.4em;
}
.marquee-track span::after { content: "/"; color: var(--accent); padding-left: 1.4em; }
@keyframes slide { to { transform: translateX(-50%); } }
.hero-tagline { font-size: clamp(1.2rem, 2.4vw, 1.7rem); font-weight: 500; max-width: 24em; line-height: 1.4; }
.scroll-hint { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; margin-top: 32px; }
.scroll-hint i { width: 48px; height: 1px; background: var(--muted); display: block; }

/* ============ Work ============ */
#work { background: var(--surface); }
.work-list { margin-top: 56px; border-top: 1px solid var(--line); }
.work-item {
  display: grid;
  grid-template-columns: 90px 1fr minmax(180px, 300px);
  gap: 32px; align-items: center;
  padding: 36px 0;
  border-bottom: 1px solid var(--line);
  transition: padding .35s ease;
}
.work-item:hover { padding-left: 16px; }
.work-year { color: var(--muted); font-size: 15px; }
.work-title { font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 600; line-height: 1.25; letter-spacing: -0.015em; transition: color .2s; }
.work-item:hover .work-title { color: var(--accent); }
.work-tags { color: var(--muted); font-size: 15px; margin-top: 10px; }
.work-thumb {
  aspect-ratio: 4 / 3;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  overflow: hidden;
  display: grid; place-items: center;
  color: var(--muted); font-size: 13px;
}
.work-thumb img { width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 800px) {
  .work-item { grid-template-columns: 1fr; gap: 14px; }
  .work-thumb { order: -1; }
}

/* ---- Dcard 卡片（首頁） ---- */
.panel { margin-top: 56px; background: var(--surface); border-radius: clamp(24px, 3vw, 32px); padding: clamp(24px, 4vw, 48px); box-shadow: var(--shadow-card); }
.panel-head { display: flex; align-items: center; gap: clamp(16px, 2.4vw, 24px); }
.logo { flex: none; width: clamp(52px, 6vw, 72px); aspect-ratio: 1; }
.logo img { width: 100%; height: 100%; object-fit: contain; }
.panel-company { color: var(--muted); font-size: 15px; font-weight: 500; }
.panel-title { margin-top: 2px; font-size: clamp(1.3rem, 2.6vw, 1.9rem); font-weight: 700; line-height: 1.3; letter-spacing: -0.015em; }
.panel-meta { margin: clamp(24px, 3.5vw, 36px) 0 0; display: grid; gap: 18px; }
.meta-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 32px; }
.meta-row > dt, .meta-row > h4 { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1.9; }
.meta-row > dd { margin: 0; max-width: 52em; line-height: 1.85; }
.invest-row { margin-top: clamp(24px, 3vw, 32px); }
.invest-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.invest-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.invest-card { display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 20px; background: var(--bg); box-shadow: 0 6px 20px color-mix(in srgb, var(--ink) 7%, transparent); transition: box-shadow .25s, transform .25s; }
.invest-card:hover { box-shadow: 0 16px 38px color-mix(in srgb, var(--ink) 13%, transparent); transform: translateY(-3px); }
.invest-cover { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: var(--surface); overflow: hidden; }
.invest-cover img { width: 100%; height: 100%; object-fit: cover; }
.invest-body { display: flex; flex: 1; flex-direction: column; align-items: flex-start; gap: 10px; padding: 4px 8px 8px; }
.invest-stage { font-size: 13px; font-weight: 500; color: var(--muted); }
.invest-card h5 { margin: 0; font-size: 1.3rem; font-weight: 700; line-height: 1.35; text-wrap: balance; }
.invest-card h5 span { display: inline-block; }
html:lang(en) .invest-card h5 span + span { margin-left: .28em; }
.invest-problem { color: var(--muted); font-size: 14.5px; line-height: 1.75; }
.invest-result { margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.invest-result strong { font-size: 2.1rem; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; }
.invest-label { font-size: 14px; line-height: 1.6; color: var(--muted); }
.invest-note { display: inline-block; white-space: nowrap; font-size: 13px; color: var(--muted); }
.invest-btn { margin-top: 6px; padding: 11px 20px; border-radius: 12px; background: var(--surface); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 10%, transparent); font-size: 15px; font-weight: 600; color: var(--ink); transition: background .2s, color .2s; }
.invest-card:hover .invest-btn { background: var(--ink); color: var(--surface); }
.cover-simple { display: grid; place-items: center; color: var(--ink); background: var(--surface); }
.invest-card.is-disabled { position: relative; cursor: default; box-shadow: none; }
.invest-card.is-disabled > .invest-flag { position: absolute; top: 28px; right: 28px; z-index: 1; opacity: 1; padding: 5px 12px; border-radius: 999px; background: #DDE2EA; color: #4A5565; font-size: 12.5px; font-weight: 700; line-height: 1.4; letter-spacing: .02em; }
.invest-card.is-disabled > .invest-body { opacity: 1; }
.invest-card.is-disabled > .invest-body > .invest-stage, .invest-card.is-disabled > .invest-body > h5, .invest-card.is-disabled > .invest-body > .invest-problem { opacity: .5; }
.invest-btns { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; gap: 10px; }
.invest-card.is-disabled .invest-btns .invest-btn, .invest-card.is-disabled:hover .invest-btns .invest-btn { margin-top: 6px; padding: 11px 20px; background: var(--surface); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink); font-weight: 600; text-decoration: none; cursor: pointer; }
.invest-card.is-disabled .invest-btns .invest-btn:hover, .invest-card.is-disabled .invest-btns .invest-btn:focus-visible { background: var(--ink); color: var(--surface); }
.invest-card.is-disabled:hover { box-shadow: none; transform: none; }
.invest-card.is-disabled > * { opacity: .5; }
.invest-card.is-disabled .invest-cover { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.invest-card.is-disabled .invest-btn { margin-top: auto; }
.invest-card.is-disabled .invest-btn, .invest-card.is-disabled:hover .invest-btn { background: transparent; box-shadow: none; color: var(--muted); padding-left: 0; font-weight: 500; }
.panel-foot { margin-top: 16px; }
.strategy-link { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-radius: 20px; background: var(--bg); transition: background .25s, color .25s, transform .25s;  box-shadow:0 6px 20px color-mix(in srgb,var(--ink) 7%,transparent); position: relative;}
.sl-text { display: flex; flex-direction: column; gap: 2px; }
.sl-text strong { font-size: 1.05rem; font-weight: 700; }
.sl-text span { font-size: 14px; color: var(--muted); transition: color .25s; }
.sl-i { font-style:normal; display:inline-block; white-space:nowrap; }
html[lang="en"] .sl-i:not(:last-child) { margin-right:.3em; }
.sl-arrow { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 18px; transition: background .25s, color .25s, transform .25s; }
.strategy-link:hover { background: var(--ink); color: var(--surface); }
.strategy-link:hover .sl-text span { color: color-mix(in srgb, var(--surface) 70%, transparent); }
.strategy-link:hover .sl-arrow { background: var(--surface); color: var(--ink); transform: translateX(4px); }
@media (max-width: 760px) {
  .meta-row { grid-template-columns: 1fr; gap: 2px; }
  .invest-grid, .invest-grid.cols-2 { grid-template-columns: 1fr; }
  .invest-cover { aspect-ratio: 2.4 / 1; }
}

/* ============ Experience ============ */
.exp-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; }
.btn {
  display: inline-block; font: inherit; font-size: 15px; font-weight: 500;
  padding: 12px 24px; border-radius: 999px;
  background: var(--ink); color: var(--bg);
  transition: background .25s, color .25s, transform .25s;
}
.btn:hover { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
.btn.ghost:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.exp-list { margin-top: 48px; border-top: 1px solid var(--line); }
.exp-row {
  display: grid; grid-template-columns: 200px 1fr auto; gap: 24px; align-items: baseline;
  padding: 26px 0; border-bottom: 1px solid var(--line);
}
.exp-years { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.exp-role { font-size: 1.25rem; font-weight: 600; }
.exp-company { color: var(--muted); }
@media (max-width: 720px) { .exp-row { grid-template-columns: 1fr; gap: 4px; } }

/* ============ Testimonials（推薦）============ */
#recommendation { background: var(--surface); }
.t-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.t-nav { display: flex; gap: 10px; }
.t-arrow { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bg); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; box-shadow: 0 6px 20px color-mix(in srgb, var(--ink) 7%, transparent); transition: background .2s, color .2s, opacity .2s; }
.t-arrow:hover:not(:disabled) { background: var(--ink); color: var(--surface); }
.t-arrow:disabled { opacity: .4; cursor: default; }
.t-track { --tp: min(48px, var(--pad)); margin: 28px calc(-1 * var(--tp)) -48px; padding: 24px var(--tp) 96px; display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 var(--tp); scrollbar-width: none; cursor: grab; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.t-track::-webkit-scrollbar { display: none; }
.t-track.dragging { cursor: grabbing; scroll-snap-type: none; user-select: none; }
.t-card { flex: 0 0 calc((100% - 16px) / 2); scroll-snap-align: start; margin: 0; display: flex; flex-direction: column; gap: 24px; padding: clamp(20px, 2.4vw, 28px); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow-card); }
.t-person { display: flex; align-items: center; gap: 14px; }
.t-avatar { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--bg); overflow: hidden; }
.t-avatar img { width: 100%; height: 100%; object-fit: cover; }
.t-initials { display: grid; place-items: center; font-weight: 700; font-size: 1.05rem; color: var(--muted); }
.t-name { font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
.t-role { color: var(--muted); font-size: 14px; line-height: 1.5; }
.t-rel { align-self: flex-start; padding: 4px 12px; border-radius: 10px; line-height: 1.5; background: var(--bg); font-size: 13px; color: var(--muted); }
.t-body { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.t-quote { margin: 0; font-size: 1rem; line-height: 1.8; color: var(--ink); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 9; line-clamp: 9; overflow: hidden; }
.t-card.open .t-quote { -webkit-line-clamp: unset; line-clamp: unset; display: block; }
.t-quote p + p { margin-top: 10px; }
.t-toggle { margin-top: auto; padding: 8px 16px; border: 0; border-radius: 12px; background: var(--bg); font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; transition: background .2s, color .2s; }
.t-toggle:hover { background: var(--ink); color: var(--surface); }
.t-toggle .less { display: none; }
.t-card.open .t-toggle .more { display: none; }
.t-card.open .t-toggle .less { display: inline; }
.t-more { margin-top: 8px; }
@media (max-width: 800px) { .t-card { flex-basis: calc(100% - 28px); } }
.t-track:has(.t-card.open) { align-items: flex-start; }
.t-link { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; font-weight: 500; transition: color .2s; }
.t-link:hover, .t-link:focus-visible { color: var(--accent); }

footer { background: var(--surface); color: var(--muted); font-size: 14px; padding: 28px 0 32px; }
footer a { color: inherit; }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .marquee-track { animation: none; }
  * { transition: none !important; }
}



.sp-hero { background: var(--surface); padding: 108px 0 clamp(48px, 7vw, 88px); }

/* 鎖定時內容很短：讓白色主區塊撐滿視窗，頁尾貼齊底部，不露出灰色底 */
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
main { flex: 1; display: flex; flex-direction: column; }
main > .sp-hero { flex: 1 0 auto; }

/* ---- 02 核心策略：一個策略一張卡片，「關鍵瓶頸（灰底）→ 策略投資（藍線）」兩段式 ---- */
.sp-table { grid-template-columns: minmax(0, 1fr); gap: 12px; }
.sp-table .sp-card { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; row-gap: 0; align-items: baseline; padding: 20px clamp(18px, 2.4vw, 26px) 22px; }

<script>
(function () {
  // Nav border on scroll
  var nav = document.getElementById('nav');
  function onScroll() { nav.classList.toggle('scrolled', window.scrollY > 10); }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // EN / 中 toggle
  var lang = 'en'; // 預設英文；訪客手動切換後會記住選擇
  try { var saved = localStorage.getItem('lang'); if (saved === 'zh' || saved === 'en') lang = saved; } catch (e) {}

  function apply() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
    document.querySelectorAll('[data-en]').forEach(function (el) {
      el.innerHTML = el.getAttribute('data-' + lang);
    });
  }

  document.getElementById('langBtn').addEventListener('click', function (e) {
    var opt = e.target.closest('.lang-opt');
    lang = opt ? opt.getAttribute('data-lang') : (lang === 'en' ? 'zh' : 'en');
    try { localStorage.setItem('lang', lang); } catch (e) {}
    apply();
  });
  apply();
  window.__applyLang = apply;

})();
</script>

<script>
(function () {
  var KEY_STORE = 'gc-strategy-key';
  var lock = document.getElementById('gcLock'), form = document.getElementById('gcForm');
  var pw = document.getElementById('gcPw'), btn = document.getElementById('gcBtn'), err = document.getElementById('gcErr');
  var content = document.getElementById('gcContent');
  var payload = JSON.parse(document.getElementById('enc-payload').textContent);
  var b = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var isZh = function () { return document.documentElement.lang === 'zh-Hant'; };

  function syncPlaceholder() { pw.placeholder = pw.getAttribute(isZh() ? 'data-ph-zh' : 'data-ph-en'); }
  new MutationObserver(syncPlaceholder).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  syncPlaceholder();

  function deriveKey(password) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(payload.salt), iterations: payload.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function decrypt(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(payload.iv) }, key, b(payload.ct)).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function reveal(html) {
    content.innerHTML = html;
    var meta = content.querySelector('.gc-meta');
    if (meta) document.getElementById('gcHero').appendChild(meta);
    lock.remove();
    content.hidden = false;
    if (window.__applyLang) window.__applyLang();
    // 從首頁小卡帶 #pillar-n 進來：解鎖後捲到對應的策略支柱並短暫標示
    var target = location.hash && document.getElementById(location.hash.slice(1));
    if (target) {
      requestAnimationFrame(function () {
        target.scrollIntoView({ block: 'center' });
        target.classList.add('gc-flash');
        setTimeout(function () { target.classList.remove('gc-flash'); }, 1800);
      });
    }
  }

  // 同一個分頁內已解鎖過：直接用暫存的金鑰（關閉分頁即失效）
  try {
    var saved = sessionStorage.getItem(KEY_STORE);
    if (saved) {
      crypto.subtle.importKey('raw', b(saved), 'AES-GCM', false, ['decrypt']).then(decrypt).then(reveal)
        .catch(function () { sessionStorage.removeItem(KEY_STORE); });
    }
  } catch (e) {}

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true; err.textContent = '';
    var key;
    deriveKey(pw.value).then(function (k) { key = k; return decrypt(k); }).then(function (html) {
      crypto.subtle.exportKey('raw', key).then(function (raw) {
        try { sessionStorage.setItem(KEY_STORE, btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch (e) {}
      });
      reveal(html);
    }).catch(function () {
      btn.disabled = false;
      err.textContent = isZh() ? '密碼不正確，請再試一次。' : 'Incorrect password. Please try again.';
      lock.classList.remove('shake'); void lock.offsetWidth; lock.classList.add('shake');
      pw.select();
    });
  });
})();
</script>

body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
img { -webkit-user-drag: none; }
</style>
<script>
(function () {
  function editable(t) { return t && t.closest && t.closest('input, textarea, [contenteditable]'); }
  ['contextmenu', 'copy', 'cut', 'selectstart', 'dragstart'].forEach(function (type) {
    document.addEventListener(type, function (e) { if (!editable(e.target)) e.preventDefault(); });
  });
})();
</script>
